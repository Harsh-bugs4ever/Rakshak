# Local AWS stack. Everything Rakshak needs, no AWS account.
#
#   docker compose up -d
#   python scripts/bootstrap.py
#   sam local start-api --port 3000

services:
  localstack:
    image: localstack/localstack:latest
    container_name: rakshak-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,opensearch
      - DEBUG=0
      - PERSISTENCE=0
      - AWS_DEFAULT_REGION=ap-south-1
    volumes:
      # Anything in this directory runs once the services are ready.
      - "./infra/localstack:/etc/localstack/init/ready.d"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
