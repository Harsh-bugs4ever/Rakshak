[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a running LocalStack (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning:botocore.*",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
